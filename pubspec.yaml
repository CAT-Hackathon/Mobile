name: met2ashara_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  bot_toast: ^4.1.3
  build_runner: ^2.4.12
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.0.5
  cupertino_icons: ^1.0.6
  curved_navigation_bar: ^1.0.6
  dartz: ^0.10.1
  dio: ^5.6.0
  dotted_border: ^2.1.0
  equatable: ^2.0.5
  fancy_shimmer_image: ^2.0.3
  flexify: ^2.1.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_bloc: ^8.1.6
  flutter_launcher_icons: ^0.13.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.10+1
  fpdart: ^1.1.0
  get_it: ^7.7.0
  go_router: ^14.1.0
  hive: ^4.0.0-dev.2
  image_picker: ^1.1.1
  injectable: ^2.4.4
  injectable_generator: ^2.6.2
  internet_connection_checker_plus: ^2.3.0
  intl: ^0.19.0
  isar_flutter_libs: ^4.0.0-dev.13
  liquid_swipe: ^3.1.0
  logger: ^2.4.0
  path_provider: ^2.1.0
  photo_view: ^0.15.0
  pinput: ^5.0.0
  pretty_dio_logger: ^1.4.0
  quickalert: ^1.1.0
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  toastification: ^2.0.0
  uuid: ^4.4.0
dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Quattrocento
      fonts:
        - asset: assets/fonts/Quattrocento-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/assets/
  filename: images.dart
  field_prefix: null
